<header class="app-header">

  <a class="brand" routerLink="/dashboard">
    <app-ax [size]="54" />
    <div>
      <h1>Ax Tracker</h1>
      <p>Banii tai, pe intelesul tau</p>
    </div>
  </a>

  @if (auth.isLoggedIn()) {
  <nav class="navigation">

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
    >
      Dashboard
    </a>

    <a
      routerLink="/transactions"
      routerLinkActive="active"
    >
      Tranzactii
    </a>

    <a
      routerLink="/categories"
      routerLinkActive="active"
    >
      Categorii
    </a>

    <a
      routerLink="/comparator"
      routerLinkActive="active"
    >
      Comparator
    </a>

    <a
      routerLink="/insights"
      routerLinkActive="active"
    >
      Insights
    </a>

    <a
      routerLink="/advisor"
      routerLinkActive="active"
      class="ai-link"
    >
      Intreaba-l pe Ax
    </a>

    <a
      routerLink="/settings"
      routerLinkActive="active"
    >
      Setari
    </a>

  </nav>

  <div class="user-menu">
    <span class="avatar">{{ (auth.user()?.displayName || '?').slice(0, 1).toUpperCase() }}</span>
    <span class="user-name">{{ auth.user()?.displayName }}</span>
    <button type="button" class="logout" (click)="auth.logout()">Iesire</button>
  </div>
  }

</header>

<main class="page-container">
  <router-outlet />
</main>

<header class="app-header">

  <div class="brand">
    <h1>Expense Tracker</h1>
    <p>Personal finance dashboard</p>
  </div>

  @if (auth.isLoggedIn()) {
  <nav class="navigation">

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
    >
      Dashboard
    </a>

    <a
      routerLink="/transactions"
      routerLinkActive="active"
    >
      Tranzactii
    </a>

    <a
      routerLink="/categories"
      routerLinkActive="active"
    >
      Categorii
    </a>

    <a
      routerLink="/comparator"
      routerLinkActive="active"
    >
      Comparator
    </a>

    <a
      routerLink="/insights"
      routerLinkActive="active"
    >
      Insights
    </a>

    <a
      routerLink="/advisor"
      routerLinkActive="active"
      class="ai-link"
    >
      Consilier
    </a>

    <a
      routerLink="/settings"
      routerLinkActive="active"
    >
      Setari
    </a>

  </nav>

  <div class="user-menu">
    <span class="avatar">{{ (auth.user()?.displayName || '?').slice(0, 1).toUpperCase() }}</span>
    <span class="user-name">{{ auth.user()?.displayName }}</span>
    <button type="button" class="logout" (click)="auth.logout()">Iesire</button>
  </div>
  }

</header>

<main class="page-container">
  <router-outlet />
</main>

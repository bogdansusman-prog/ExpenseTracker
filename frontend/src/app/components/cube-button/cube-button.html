<a class="button-icon" [href]="href()" target="_blank" rel="noopener" [attr.aria-label]="label()">
  <span class="icon" aria-hidden="true">
    @if (icon() === 'code') {
      <svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" /></svg>
    } @else {
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12h18" /></svg>
    }
  </span>
  <span class="cube" aria-hidden="true">
    <span class="side front">{{ label() }}</span>
    <span class="side top">{{ hoverLabel() }}</span>
  </span>
</a>
